[package]
name = "sentra-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Command-line interface for the Sentra security research and remediation platform"
documentation = "https://docs.rs/sentra-cli"
keywords = ["security", "cli", "sast", "audit", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sentra"
path = "src/main.rs"

[dependencies]
sentra-core = { path = "../sentra-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Own `main`: the test binary doubles as a fake CodeQL launcher (see the file header).
[[test]]
name = "codeql_host_tests"
harness = false
