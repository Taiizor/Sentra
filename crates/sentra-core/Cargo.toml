[package]
name = "sentra-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Core security analysis, taint tracking, advisory auditing, and verification engine for Sentra"
documentation = "https://docs.rs/sentra-core"
keywords = ["security", "sast", "taint-analysis", "vulnerability", "audit"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
