[package]
name = "sentra-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# Embeds every assets/skills/<id>/ directory (see build.rs).
build = "build.rs"
description = "Core security analysis, lexical taint tracking, advisory auditing, and verification models for Sentra"
documentation = "https://docs.rs/sentra-core"
keywords = ["security", "sast", "taint-analysis", "vulnerability", "audit"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }

# Windows Job Object (kill-on-close) that contains every adapter process tree.
# `std` cannot create job objects and `#![forbid(unsafe_code)]` rules out direct
# FFI, so this safe wrapper is the only way to guarantee that an adapter's
# descendants die with the session (see src/plugin/process.rs).
[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"
