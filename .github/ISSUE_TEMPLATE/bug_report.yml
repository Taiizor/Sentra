name: Bug Report
description: Create a report to help us reproduce and fix a bug in Sentra.
title: "[BUG]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Sentra! Please provide detailed information so we can reproduce and fix it.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Sentra is affected?
      options:
        - "sentra-core (Rust core engine, workspace boundary, persistence, advisory)"
        - "sentra-cli (CLI commands, flags, terminal outputs)"
        - "web (Vite/React operations dashboard)"
        - "mcp (Model Context Protocol server)"
        - "sast / taint (Static analysis and taint engine)"
        - "verification / worker (Disposable worker containment and bundle verification)"
        - "other"
    validations:
      required: true
  - type: checkboxes
    id: os
    attributes:
      label: Operating System
      description: Which operating system(s) did this occur on?
      options:
        - label: "Windows 11 / Windows 10 x64"
        - label: "Linux x86_64 (e.g. Debian, Ubuntu)"
        - label: "macOS (Apple Silicon / Intel)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or CLI commands to reproduce the behavior.
      placeholder: |
        1. Run `sentra init --workspace ...`
        2. Execute `sentra audit ...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output
      description: Relevant command logs or terminal outputs. Sensitive credentials and file paths will be redacted.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Rust version (`rustc --version`), Bun version (`bun --version`), SQLite version, etc.
