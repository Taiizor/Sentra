<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-shield-bg" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="fav-rim" x1="12" y1="8" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="fav-s" x1="30" y1="26" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <path
    d="M 50 6 L 90 22 C 90 58 76 82 50 94 C 24 82 10 58 10 22 Z"
    fill="url(#fav-shield-bg)"
    stroke="url(#fav-rim)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- S-Curve Flow -->
  <path
    d="M 68 31 C 68 26 62 24 50 24 C 36 24 33 28 33 34 C 33 42 41 46 51 49 C 64 53 67 58 67 66 C 67 72 62 76 50 76 C 36 76 32 72 32 67"
    stroke="url(#fav-s)"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Central Sentinel Diamond -->
  <polygon
    points="50,41 60,50 50,59 40,50"
    fill="#38bdf8"
    stroke="#ffffff"
    stroke-width="2"
  />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
